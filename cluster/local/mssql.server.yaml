apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: default
spec:
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: mssql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: default
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2019-CU32-ubuntu-20.04
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mssql-creds
              key: password
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Developer"
        ports:
        - containerPort: 1433
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1"'
          # Poll early and often: the pod is Ready the moment sa can log in,
          # not 30s later. failureThreshold covers a slow (emulated) start.
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1"'
          # Must not fire before a slow start has finished, or the container
          # gets restarted mid-boot.
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      # emptyDir, not a PVC: the data never outlives the test run, and a
      # claim adds a provisioner round trip to every start-up.
      - name: data
        emptyDir: {}
